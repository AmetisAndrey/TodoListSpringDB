<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="${isNew} ? 'Новая задача' : 'Редактирование задачи'"></title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top left, #4f46e5 0, #0f172a 45%, #020617 100%);
            color: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .nav-brand-title {
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .card-glass {
            background: rgba(248, 250, 252, 0.96);
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.45);
        }

        .btn-soft-primary {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            border: none;
            color: white;
            border-radius: 999px;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.45);
        }

        .btn-soft-primary:hover {
            filter: brightness(1.05);
            color: #e5e7eb;
        }

        .btn-secondary-pill {
            border-radius: 999px;
        }

        .field-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .form-control,
        .form-select {
            border-radius: 0.9rem;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: 0 0 0 0.15rem rgba(79, 70, 229, 0.25);
            border-color: rgba(79, 70, 229, 0.7);
        }

        .error-text {
            font-size: 0.8rem;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6b7280;
            font-weight: 600;
        }

        .bubble-hint {
            background: rgba(148, 163, 184, 0.1);
            border-radius: 999px;
            padding: 0.4rem 0.85rem;
            font-size: 0.8rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark px-3 px-md-5 mt-2">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/tasks}">
            <i class="bi bi-kanban-fill fs-4"></i>
            <span class="nav-brand-title">Task Manager</span>
        </a>
    </div>
</nav>

<div class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-7">
            <div class="card card-glass p-3 p-md-4 p-lg-5">

                <div class="d-flex justify-content-between align-items-start mb-3 mb-md-4">
                    <div>
                        <h2 class="mb-1" th:text="${isNew} ? 'Новая задача' : 'Редактирование задачи'"></h2>
                        <p class="text-muted mb-0">
                            Заполните основные поля: название, приоритет, статус и срок выполнения.
                        </p>
                    </div>
                    <div class="d-none d-md-block bubble-hint">
                        <i class="bi bi-lightbulb"></i>
                        <span>Форма отправляется через POST /tasks</span>
                    </div>
                </div>

                <form th:action="${isNew} ? @{/tasks} : @{|/tasks/${taskForm.id}/edit|}"
                      th:object="${taskForm}"
                      method="post"
                      class="mt-2">

                    <div class="mb-3 mb-md-4">
                        <div class="section-title mb-2">Основное</div>

                        <div class="mb-3">
                            <label class="field-label">Название</label>
                            <input type="text" class="form-control"
                                   placeholder="Например: Подготовить отчёт по спринту"
                                   th:field="*{title}">
                            <div class="text-danger error-text"
                                 th:if="${#fields.hasErrors('title')}"
                                 th:errors="*{title}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="field-label">Описание</label>
                            <textarea class="form-control"
                                      rows="3"
                                      placeholder="Кратко опишите, что именно нужно сделать"
                                      th:field="*{description}"></textarea>
                        </div>
                    </div>
                    <div class="mb-3 mb-md-4">
                        <div class="section-title mb-2">Параметры</div>

                        <div class="row g-3">
                            <div class="col-12 col-md-4">
                                <label class="field-label">Приоритет</label>
                                <select class="form-select" th:field="*{priority}">
                                    <option th:each="p : ${allPriorities}"
                                            th:value="${p}"
                                            th:text="${p}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-12 col-md-4">
                                <label class="field-label">Статус</label>
                                <select class="form-select" th:field="*{status}">
                                    <option th:each="s : ${allStatuses}"
                                            th:value="${s}"
                                            th:text="${s}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-12 col-md-4">
                                <label class="field-label">Срок (дедлайн)</label>
                                <input type="date" class="form-control" th:field="*{dueDate}">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-stretch align-items-md-center mt-4">
                        <div class="mb-3 mb-md-0">
                            <button type="submit" class="btn btn-soft-primary d-inline-flex align-items-center gap-2 px-4">
                                <i class="bi bi-check2-circle"></i>
                                <span th:text="${isNew} ? 'Создать задачу' : 'Сохранить изменения'"></span>
                            </button>
                        </div>
                        <div>
                            <a class="btn btn-outline-secondary btn-secondary-pill d-inline-flex align-items-center gap-2 px-3"
                               th:href="@{/tasks}">
                                <i class="bi bi-arrow-left"></i>
                                Вернуться к списку
                            </a>
                        </div>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
</body>
</html>
