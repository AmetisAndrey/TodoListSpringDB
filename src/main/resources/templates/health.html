<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Статус системы</title>

  <!-- Bootstrap -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Иконки -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at top left, #4f46e5 0, #0f172a 45%, #020617 100%);
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .nav-brand-title {
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .card-glass {
      background: rgba(248, 250, 252, 0.96);
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.45);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-pill-ok {
      background: rgba(34, 197, 94, 0.16);
      color: #166534;
    }

    .status-pill-bad {
      background: rgba(248, 113, 113, 0.22);
      color: #b91c1c;
    }

    .metric-card {
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: white;
      padding: 1.1rem 1.3rem;
    }

    .metric-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin-bottom: 0.15rem;
    }

    .metric-value {
      font-size: 0.98rem;
      font-weight: 500;
    }

    .badge-tech {
      background: rgba(15, 23, 42, 0.86);
      color: #e5e7eb;
      border-radius: 999px;
      font-size: 0.75rem;
      padding: 0.25rem 0.7rem;
    }

    .btn-back {
      border-radius: 999px;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark px-3 px-md-5 mt-2">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/tasks}">
      <i class="bi bi-kanban-fill fs-4"></i>
      <span class="nav-brand-title">Task Manager</span>
    </a>
    <div class="d-flex align-items-center gap-2">
      <span class="badge-tech">Spring Boot</span>
    </div>
  </div>
</nav>

<div class="container py-4 py-md-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card card-glass p-3 p-md-4 p-lg-5">

        <div class="d-flex justify-content-between align-items-start mb-3 mb-md-4">
          <div>
            <h2 class="mb-1">Статус системы</h2>
            <p class="text-muted mb-0">
              Проверить статус подключения к Базе данных и версию JVM
            </p>
          </div>
          <div>
                        <span class="status-pill"
                              th:classappend="${dbOk} ? ' status-pill-ok' : ' status-pill-bad'">
                            <i class="bi"
                               th:classappend="${dbOk} ? ' bi-check-circle-fill' : ' bi-exclamation-circle-fill'"></i>
                            <span th:text="${dbOk} ? 'OK' : 'PROBLEM'"></span>
                        </span>
          </div>
        </div>
        <div class="mb-3 mb-md-4">
          <div class="metric-card mb-2">
            <div class="metric-label">Приложение</div>
            <div class="metric-value" th:text="${appName} + ' (Spring Boot, JDBC)'"></div>
          </div>

          <div class="metric-card">
            <div class="metric-label">Время проверки</div>
            <div class="metric-value"
                 th:text="${#temporals.format(now, 'dd.MM.yyyy HH:mm:ss')}"></div>
          </div>
        </div>
        <div class="mb-3 mb-md-4">
          <h6 class="text-uppercase text-muted mb-3" style="letter-spacing: 0.09em; font-size: 0.78rem;">
            Инфраструктура
          </h6>

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <div class="metric-card h-100">
                <div class="metric-label">База данных</div>
                <div class="metric-value d-flex align-items-center gap-2 mb-1">
                  <i class="bi"
                     th:classappend="${dbOk} ? ' bi-database-check text-success' : ' bi-database-x text-danger'"></i>
                  <span th:text="${dbOk} ? 'PostgreSQL: доступна' : 'PostgreSQL: ошибка'"></span>
                </div>
                <div class="text-muted small"
                     th:text="${dbMessage}">
                </div>
              </div>
            </div>

            <div class="col-12 col-md-6">
              <div class="metric-card h-100">
                <div class="metric-label">Java / JVM</div>
                <div class="metric-value mb-1">
                  <span th:text="'Java ' + ${javaVersion}"></span>
                </div>
                <div class="text-muted small">
                  Приложение запущено как Spring Boot Web.
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
          <a class="btn btn-outline-secondary btn-back d-inline-flex align-items-center gap-2 px-3"
             th:href="@{/tasks}">
            <i class="bi bi-arrow-left"></i>
            Вернуться к задачам
          </a>
          <span class="text-muted small">
                        URL: <code>/health</code> · проверка JDBC + Thymeleaf
                    </span>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
