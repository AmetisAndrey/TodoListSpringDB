<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Менеджер задач</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Иконки Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top left, #4f46e5 0, #0f172a 45%, #020617 100%);
            color: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .nav-brand-title {
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .card-glass {
            background: rgba(248, 250, 252, 0.96);
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.45);
        }

        .badge-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* Новый статус NEW — синий */
        .badge-status.NEW {
            background: rgba(59, 130, 246, 0.14);
            color: #1d4ed8;
        }

        /* В процессе — жёлтый */
        .badge-status.IN_PROGRESS {
            background: rgba(234, 179, 8, 0.16);
            color: #92400e;
        }

        /* Готово — зелёный */
        .badge-status.DONE {
            background: rgba(34, 197, 94, 0.16);
            color: #166534;
        }


        .priority-pill {
            padding: 0.2rem 0.65rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .priority-LOW {
            background: #e0f2fe;
            color: #0ea5e9;
        }

        .priority-MEDIUM {
            background: #fef9c3;
            color: #eab308;
        }

        .priority-HIGH {
            background: #fee2e2;
            color: #ef4444;
        }

        .table thead th {
            border-bottom-width: 1px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
        }

        .table tbody td {
            vertical-align: middle;
        }

        .task-title {
            font-weight: 600;
            color: #0f172a;
        }

        .task-description {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .filters-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            font-weight: 600;
        }

        .btn-soft {
            border-radius: 999px;
        }

        .btn-soft-primary {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            border: none;
            color: white;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.45);
        }

        .btn-soft-primary:hover {
            filter: brightness(1.05);
            color: #e5e7eb;
        }

        .btn-icon {
            border-radius: 999px;
            padding: 0.25rem 0.6rem;
            font-size: 0.8rem;
        }

        .table-responsive {
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            overflow: hidden;
            background: white;
        }

        .alert-soft {
            border-radius: 12px;
        }

        .chip-empty {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.08);
            color: #6b7280;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark px-3 px-md-5 mt-2">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#" th:href="@{/tasks}">
            <i class="bi bi-kanban-fill fs-4"></i>
            <span class="nav-brand-title">Task Manager</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-dark bg-opacity-75">PostgreSQL</span>
        </div>
    </div>
</nav>

<div class="container py-4 py-md-5">
    <div class="card card-glass p-3 p-md-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3 mb-md-4">
            <div>
                <h2 class="mb-1">Список задач</h2>
                <p class="text-muted mb-0">
                    Простое веб-приложение на Spring Boot(TODO list).
                </p>
            </div>
            <div class="mt-3 mt-md-0 d-flex gap-2">
                <a class="btn btn-soft btn-soft-primary btn-soft d-flex align-items-center gap-2"
                   th:href="@{/tasks/new}">
                    <i class="bi bi-plus-lg"></i>
                    <span>Новая задача</span>
                </a>
            </div>
        </div>
        <div th:if="${message}" class="alert alert-soft alert-success d-flex align-items-center gap-2 mb-3 mb-md-4"
             role="alert">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${message}"></span>
        </div>

        <div class="border rounded-4 p-3 p-md-4 mb-3 mb-md-4 bg-white bg-opacity-75">
            <form class="row gy-2 gx-2 align-items-end" th:action="@{/tasks}" method="get">
                <div class="col-12 mb-2">
                    <span class="filters-label">Фильтрация</span>
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label mb-1 small text-muted">Статус</label>
                    <select class="form-select form-select-sm" name="status">
                        <option value="" th:selected="${selectedStatus == null}">Все статусы</option>
                        <option th:each="st : ${allStatuses}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${selectedStatus == st}">
                        </option>
                    </select>
                </div>

                <div class="col-12 col-md-4">
                    <label class="form-label mb-1 small text-muted">Приоритет</label>
                    <select class="form-select form-select-sm" name="priority">
                        <option value="" th:selected="${selectedPriority == null}">Любой приоритет</option>
                        <option th:each="p : ${allPriorities}"
                                th:value="${p}"
                                th:text="${p}"
                                th:selected="${selectedPriority == p}">
                        </option>
                    </select>
                </div>

                <div class="col-12 col-md-4 text-md-end">
                    <div class="d-flex gap-2 justify-content-start justify-content-md-end mt-2">
                        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" type="submit">
                            <i class="bi bi-funnel"></i> Применить
                        </button>
                        <a class="btn btn-sm btn-outline-light border rounded-pill px-3" th:href="@{/tasks}">
                            Сбросить
                        </a>
                    </div>
                </div>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(tasks)}" class="text-center py-5">
            <div class="chip-empty mb-3 justify-content-center">
                <i class="bi bi-info-circle"></i>
                <span>Пока нет задач</span>
            </div>
            <p class="text-muted mb-3">
                Начните с создания первой задачи — приложение покажет её в списке.
            </p>
            <a class="btn btn-soft btn-soft-primary d-inline-flex align-items-center gap-2"
               th:href="@{/tasks/new}">
                <i class="bi bi-plus-lg"></i>
                Создать задачу
            </a>
        </div>


        <div th:if="${!#lists.isEmpty(tasks)}" class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="bg-slate-50">
                <tr>
                    <th class="ps-3">ID</th>
                    <th>Задача</th>
                    <th>Статус</th>
                    <th>Приоритет</th>
                    <th>Срок</th>
                    <th class="text-end pe-3">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tasks}">
                    <td class="ps-3 text-muted small" th:text="${t.id}"></td>

                    <td>
                        <div class="task-title" th:text="${t.title}"></div>
                        <div class="task-description text-truncate" th:text="${t.description}"></div>
                    </td>

                    <td>
                        <span class="badge badge-status"
                              th:text="${t.status}"
                              th:classappend="' ' + ${t.status}">
                        </span>
                    </td>

                    <td>
                        <span class="priority-pill"
                              th:classappend="' priority-' + ${t.priority}">
                            <span th:text="${t.priority}"></span>
                        </span>
                    </td>

                    <td>
                        <span class="small text-muted" th:text="${t.dueDate} ?: '-'"></span>
                    </td>

                    <td class="text-end pe-3">

                        <a class="btn btn-sm btn-outline-primary btn-icon me-1"
                           th:href="@{|/tasks/${t.id}/edit|}">
                            <i class="bi bi-pencil-square"></i>
                        </a>

                        <form th:action="@{|/tasks/${t.id}/done|}"
                              method="post"
                              class="d-inline">
                            <button class="btn btn-sm btn-success btn-icon me-1"
                                    type="submit"
                                    th:disabled="${t.status.name() == 'DONE'}"
                                    th:classappend="${t.status.name() == 'DONE'} ? ' disabled'">
                                <i class="bi bi-check-lg"></i>
                            </button>
                        </form>

                        <form th:action="@{|/tasks/${t.id}/delete|}"
                              method="post"
                              class="d-inline"
                              onsubmit="return confirm('Удалить задачу?');">
                            <button class="btn btn-sm btn-outline-danger btn-icon" type="submit">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </form>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
</body>
</html>
